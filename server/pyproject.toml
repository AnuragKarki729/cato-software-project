[project]
name = "cato-server"
version = "0.1.0"
description = "Cato web app server (FastAPI)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pymysql>=1.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "pytest>=8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
