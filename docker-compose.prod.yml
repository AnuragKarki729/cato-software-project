# Production: used by GitHub Actions on the host machine. For local work use docker-compose.yml.
name: cato-prod

services:
  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    restart: always

  server:
    image: ghcr.io/anuragkarki729/cato-server:latest
    env_file: .env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: ghcr.io/anuragkarki729/cato-client:latest
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  db-data:
  uploads:
