name: cato-sad

services:
  db:
    image: mysql:8.4
    env_file: .env
    # No host port: only the server container talks to MySQL.
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  server:
    build: ./server
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/code/app      # live reload while coding
      - ./server/tests:/code/tests
      - uploads:/data/uploads       # uploaded videos and resumes
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src       # live reload while coding
    depends_on:
      - server

volumes:
  db-data:
  uploads:
