name: cato-simple

services:
  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  server:
    build: ./server
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/app/app   # live reload while coding
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://server:8000
    volumes:
      - ./client/src:/app/src   # live reload while coding
    depends_on:
      - server

volumes:
  db-data:
